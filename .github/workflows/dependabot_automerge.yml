name: Dependabot auto-merge

# MeshForge parity port (MF 45a4c27 follow-up). Born 2026-06-09: seven green
# dependabot PRs sat unmergeable across MeshForge and this repo because a CI
# refactor removed the required 'Syntax Check' status context (fixed in
# 855a23e4). The pile-up exposed the second gap — nothing merged green
# dependabot PRs even when they COULD merge. This arms GitHub auto-merge on
# every dependabot PR at open time; the branch-protection required checks
# remain the sole gate, so "must be green to merge" is enforced by GitHub,
# not by this workflow. A red check = the PR just sits, visibly, with the
# CI failure comment on it.
#
# Scope note: dependabot here only watches github-actions bumps (see
# .github/dependabot.yml) — CI-only blast radius. If a pip ecosystem is
# ever added there, revisit whether runtime-dep majors should auto-merge.
#
# Known limitation: merges performed with GITHUB_TOKEN do not trigger the
# on-push CI run for the merge commit on main. The PR run already proved
# the exact merge result green, so this is accepted.

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    # Fork PRs never get a write token under pull_request, so the gh call
    # below could only 403 — skip them (same reasoning as the overdue check).
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.fork == false
    steps:
      - name: Arm auto-merge (squash) — merges only when required checks pass
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
