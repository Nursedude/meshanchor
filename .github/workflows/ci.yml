name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Least-privilege default for every job; the pr-comment job widens
# pull-requests for its sticky failure comment.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Run MeshAnchor linter
        run: python3 scripts/lint.py --all

      - name: Advisory scan for hardcoded secrets (non-blocking)
        run: |
          # Advisory only — docstring usage examples legitimately match this
          # pattern, so it cannot hard-fail. Blocking secret hygiene lives in
          # lint + review.
          HITS=$(grep -rn "password\s*=\s*['\"][^'\"]\+" src/ --include="*.py" \
            | grep -v "password\s*=\s*['\"]['\"]" | grep -v "#" | head -5 || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::warning::Potential hardcoded passwords above — verify they are docstring examples"
          else
            echo "No potential hardcoded passwords found"
          fi

  # Branch protection REQUIRES the literal context "Syntax Check" — the
  # 2026-06-09 fold-into-lint (1635e67c, MeshForge parity) made every PR
  # unmergeable: checks all green, but the required context never reported.
  # Keep this job's name in lockstep with the protection rule.
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Check Python syntax
        # compileall exits nonzero on any syntax error (the old standalone
        # syntax-check job used `find -exec py_compile \;`, which swallowed
        # per-file failures and could never fail).
        run: python -m compileall -q src

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Kill job if tests hang
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          # Deps are installed inline below, so key the wheel cache off the
          # requirements files plus this workflow (rotates when the inline
          # list changes).
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt
            .github/workflows/ci.yml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout rich textual flask pyyaml requests psutil distro
          pip install meshcore || echo "meshcore optional - continuing"
          pip install meshtastic || echo "meshtastic optional gateway - continuing"
          pip install folium || echo "folium optional - continuing"

      - name: Run tests
        id: pytest
        run: |
          set -o pipefail
          python -m pytest tests/ -v --tb=short --timeout=30 --timeout-method=thread --ignore=tests/test_bridge_integration.py 2>&1 | tee /tmp/pytest.log | head -500
        env:
          CI: true
          MESHANCHOR_CI: true

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-log-py${{ matrix.python-version }}
          path: /tmp/pytest.log
          if-no-files-found: ignore

  pr-comment:
    name: PR Failure Comment
    runs-on: ubuntu-latest
    # Scoped write permission lives ONLY on this job — it never runs user code
    # from the PR branch, so GITHUB_TOKEN cannot be exfiltrated by test code.
    permissions:
      pull-requests: write
    needs: test
    if: always() && needs.test.result == 'failure' && github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Download pytest log
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pytest-log-py${{ matrix.python-version }}
          path: /tmp/pytest-artifact
        continue-on-error: true

      - name: Build sanitized comment body
        id: build
        if: steps.download.outcome == 'success'
        env:
          PY_VERSION: ${{ matrix.python-version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path

          log_path = Path('/tmp/pytest-artifact/pytest.log')
          if not log_path.exists():
              print('No pytest log artifact; skipping comment', file=sys.stderr)
              sys.exit(0)

          raw = log_path.read_text(encoding='utf-8', errors='replace')
          # Replace triple-backtick runs so pytest output cannot break out of the
          # markdown code fence. U+200B (zero-width space) keeps the glyphs visible.
          ZWSP = '\u200b'
          sanitized = raw.replace('```', f'`{ZWSP}`{ZWSP}`')

          lines = sanitized.splitlines()
          failed = [l for l in lines if re.match(r'^(FAILED |ERROR |E {3})', l)][:30]
          tail = '\n'.join(lines[-60:])

          py = os.environ['PY_VERSION']
          run_url = os.environ['RUN_URL']
          sha = os.environ['SHA'][:7]

          parts = [
              f'## Pytest failure (Python {py})',
              '',
              f'Job failed on `{sha}`. [View full run]({run_url}).',
              '',
          ]
          if failed:
              parts.extend([
                  '### Failures/Errors',
                  '',
                  '```',
                  '\n'.join(failed),
                  '```',
                  '',
              ])
          parts.extend([
              '### Tail of pytest output',
              '',
              '```',
              tail,
              '```',
              '',
              f'_Full log available as artifact `pytest-log-py{py}`._',
          ])

          Path('/tmp/pr-comment.md').write_text('\n'.join(parts), encoding='utf-8')
          print(f'Wrote /tmp/pr-comment.md ({len(failed)} failure lines, {len(lines)} total lines)')
          PY

      - name: Post sticky comment
        if: steps.download.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: pytest-py${{ matrix.python-version }}
          path: /tmp/pr-comment.md

# NOTE: the old standalone `syntax-check` and `security` jobs were
# consolidated into the `lint` job (2026-06-09): syntax-check's gate moved
# there as a compileall step; security's shell=True grep was a strict subset
# of lint rule MF002 and its secrets step could never fail (now an advisory
# step in lint). One runner instead of three for the static checks.
