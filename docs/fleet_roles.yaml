# MeshAnchor fleet role definitions — the MeshCore-side companion to
# MeshForge's docs/fleet_roles.yaml (sister repo, ported 2026-07-18).
#
# GENERIC + DUPLICABLE. Contains NO instance values (hostnames, LAN IPs, LXMF
# hashes, MeshCore node IDs, coordinates) — those live in ~/.config/meshanchor
# and are never committed (MF014/MF015). This is the source of truth for what
# each MeshAnchor role runs; scripts/provision_role.py converges a box to it and
# monitoring.fleet_watchdog raises a `role_drift` blackout when a box diverges.
#
# Service values: enabled | disabled | absent.
#   enabled  = unit installed, enabled+active
#   disabled = unit installed but deliberately enabled=false/inactive (not a fault)
#   absent   = unit not installed for this role
version: 0
updated: "2026-07-18"

# Hard rules that hold on every MeshAnchor node.
invariants:
  one_rnsd_per_box: "Only rnsd hosts RNS; every other RNS user (meshanchor-daemon) joins via share_instance=Yes. On a MeshAnchor NOC box rnsd legitimately owns the @rns listener and meshanchor-daemon is a client — no rival to mask here (contrast the MeshForge side, where a MeshForge box masks a rival meshanchor-daemon)."
  fail_loud_restart_clean: "Watchdog on every node; services systemd-supervised with Restart=."
  born_correct_permissions: "Every box runs services as the NON-ROOT operator user and owns its RNS config tree + app data-roots. Established at install + enforced on every converge via the shared utils.fleet_foundation SSOT (byte-parity-tracked with MeshForge)."

# The born-correct permission FOUNDATION. Executable SSOT is
# src/utils/fleet_foundation.py (carried byte-identical from MeshForge, parity-
# tracked); this block is its DECLARED model. Applied at converge by
# `scripts/provision_role.py --apply`.
foundation:
  topology: fleet                    # fleet (operator user + parity) | standalone
  service_user: operator             # services run as the NON-ROOT operator user.
                                     # Per-box RESOLVED (get_real_username()); NEVER
                                     # a literal username here (MF014).
  data_roots:                        # app data dirs the non-root services must own
    meshanchor:
      - "~/.config/meshanchor"
      - "~/.local/share/meshanchor"
      - "~/.cache/meshanchor"
      - "/opt/meshanchor"

roles:

  # ── Provisionable Linux NOC box ─────────────────────────────────────────
  meshanchor-noc:
    board_tier: pi4_min_4gb
    install_profile: full
    repo: meshanchor
    services:
      rnsd: enabled                  # this box hosts the shared RNS instance
      mosquitto: enabled
      meshanchor-daemon: enabled     # the MeshCore<->RNS/LXMF back end
      meshanchor-map: enabled        # NOC web map (:5000)
      meshanchor-fleet-collector: enabled  # always-on /fleet/* writer
      meshanchor-fleet-watchdog: enabled   # silence + role-drift watchdog
      meshtasticd: disabled          # MeshCore-primary; meshtasticd egress-only/off
      meshanchor-gateway: disabled   # RF bridge deliberately off on the NOC
    # `systemd --user` timers (see the note below the roles). DECLARE-AND-OBSERVE:
    # role_drift reports a mismatch, `--apply` never touches a user unit.
    # Declared from a live survey cross-checked against `systemctl --user
    # is-enabled` (2026-08-09), not from memory.
    user_timers:
      meshanchor-map-poke.timer: enabled
      meshanchor-map-restart.timer: enabled       # ⚠️ its [Install] says
                                     # WantedBy=timers.target but the enable
                                     # symlink lives in default.target.wants —
                                     # enabled and firing either way. Left as
                                     # found; re-enabling would move it.
      meshanchor-mini-dudeai-dream.timer: enabled
      # ── MeshForge organs co-resident on this box ──────────────────────────
      # This host runs BOTH stacks, and MeshAnchor's fleet-watchdog is the ONLY
      # role_drift that runs here (MeshForge's is inert — the box carries no
      # MeshForge deployment.json, so it declares no MeshForge role). So this
      # block covers the BOX, not just the app; without these lines nothing
      # checks them anywhere. ⚠️ Coupling accepted deliberately: a MeshForge
      # change to what runs here must update these two lines, and until it does
      # role_drift will say so — which is the correct alert, not a false one.
      meshforge-tracer.timer: enabled
      meshforge-synth-soak.timer: absent          # 2026-08-09: this box read
                                     # `synth_soak_degraded` for 78 DAYS over
                                     # seven hand-fired May lab runs, blaming a
                                     # timer it has never had. The exerciser is
                                     # a gateway organ and belongs on the
                                     # MeshForge gateway, not here. This line is
                                     # what makes "someone enabled it" visible
                                     # instead of silent.

# ── MeshCore RADIO node types (documented, NOT provisioned here) ───────────
# These are MeshCore FIRMWARE roles on the LoRa hardware (they show on the NOC
# :5000 map), not Linux systemd boxes — the provisioner SKIPS them. Listed for a
# complete picture of the MeshCore fleet topology, mirroring how MeshForge's
# catalog documents external/firmware roles (e.g. `bot`).
# user_timers — `systemd --user` timers, declared separately from `services`
# (ported from MeshForge 2026-08-09). Same vocabulary: enabled | disabled |
# absent. Inherited through `inherits` exactly like `services`, so an inheriting
# role that does NOT run a parent's timer must say `absent` explicitly. Nothing
# inherits in this catalog yet; the rule is carried in lockstep so the two
# provisioners cannot answer it differently later.
#
# WHY A SEPARATE BLOCK, and why the provisioner only ever WARNS about these:
# `services` entries are converged by `provision_role.py --apply`, which enables
# and disables units. User units are a different scope — invisible to system
# `systemctl`, and root cannot reach the operator's bus — and teaching `--apply`
# to start/stop them would hand the converge sweep exactly the power behind the
# 2026-07-24 MeshForge incident, where a restart loop started a unit that was
# off by design. So: live enrollment is read from the enable symlink, a mismatch
# is a required warning that role_drift counts as drift, and convergence is left
# to a human who can decide whether the box or the declaration is wrong.
#
# ⚠️ Enablement is a symlink under ANY target's `*.target.wants/`, not only
# `timers.target.wants` — see meshanchor-map-restart.timer above, which lives in
# `default.target.wants` and is enabled and firing regardless. Reading one
# directory reports such a timer as disabled, which for a declared-`enabled`
# unit is FALSE drift. utils/user_units.py discovers all of them.
#
# WHAT THIS BUYS: before the declaration, "never enrolled here" and "enrolled,
# then someone disabled it" were the same observation — the filesystem cannot
# tell them apart, so a silently-retired organ looked identical to a box that
# never ran one. The declaration is what separates them.

mesh_node_types:
  usb:    "USB-attached companion radio (host-tethered client)."
  client: "Companion/client node — phone/host paired, no infrastructure role."
  room:   "Room Server — MeshCore chat-room/BBS host."
  server: "Repeater/server node — infrastructure relay."
