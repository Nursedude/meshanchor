<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Monitor — MeshAnchor NOC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            background: #0a0e1a;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        body { padding: 16px; }

        /* ── Top bar ───────────────────────────────────────── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: #141e2e;
            border: 1px solid #2a3a4a;
            border-radius: 10px;
            margin-bottom: 16px;
        }
        .topbar h1 {
            font-size: 18px;
            font-weight: 600;
            color: #4fc3f7;
            letter-spacing: 0.3px;
        }
        .topbar .meta {
            font-size: 12px;
            color: #6a7a8a;
        }
        .topbar .meta strong { color: #b0c0d0; font-weight: 500; }
        .pulse {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #66bb6a;
            margin-right: 6px;
            box-shadow: 0 0 6px rgba(102,187,106,0.7);
            animation: pulse 1.6s infinite;
        }
        .pulse.stale { background: #ef5350; box-shadow: 0 0 6px rgba(239,83,80,0.7); }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.4; }
        }

        /* ── Layout grid ───────────────────────────────────── */
        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
        }
        .col { display: flex; flex-direction: column; gap: 16px; }

        /* ── Cards ─────────────────────────────────────────── */
        .card {
            background: #141e2e;
            border: 1px solid #2a3a4a;
            border-radius: 10px;
            overflow: hidden;
        }
        .card h2 {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 16px;
            background: #0f1622;
            color: #6a7a8a;
            border-bottom: 1px solid #2a3a4a;
        }
        .card .body { padding: 14px 16px; }

        /* ── SLO banner ────────────────────────────────────── */
        .slo-banner {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 20px;
            background: linear-gradient(135deg, #102030 0%, #1a2438 100%);
            border-bottom: 1px solid #2a3a4a;
        }
        .slo-status {
            font-size: 28px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .slo-status.ready    { color: #66bb6a; text-shadow: 0 0 12px rgba(102,187,106,0.5); }
        .slo-status.degraded { color: #ffa726; text-shadow: 0 0 12px rgba(255,167,38,0.5); }
        .slo-status.error    { color: #ef5350; text-shadow: 0 0 12px rgba(239,83,80,0.5); }
        .slo-status.unknown  { color: #6a7a8a; }
        .slo-detail { color: #b0c0d0; font-size: 13px; flex: 1; }
        .slo-detail strong { color: #e0e0e0; font-weight: 600; }
        .slo-optional { color: #6a7a8a; font-size: 11px; margin-left: 6px; }

        /* ── Service pills ─────────────────────────────────── */
        .pills { display: flex; flex-wrap: wrap; gap: 6px; }
        .pills-optional {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed #2a3a4a;
        }
        .pills-optional::before {
            content: "optional:";
            font-size: 10px;
            color: #6a7a8a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            align-self: center;
            margin-right: 4px;
        }
        .pills-optional:empty { display: none; }
        .pill {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* Optional pills muted — they shouldn't compete with required
           pills for attention. Same hue family, lower contrast. */
        .pills-optional .pill {
            opacity: 0.65;
            font-size: 10px;
            padding: 3px 8px;
        }
        .pill.available     { background: #1b3a25; color: #66bb6a; }
        .pill.degraded      { background: #3d2c10; color: #ffa726; }
        .pill.failed        { background: #3a1a1a; color: #ef5350; }
        .pill.not_running   { background: #2a2a2a; color: #999; }
        .pill.not_installed { background: #1a1a1a; color: #555; }
        .pill.unknown       { background: #1a2030; color: #6a7a8a; }

        /* ── Tables ────────────────────────────────────────── */
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td {
            padding: 6px 10px;
            text-align: left;
            border-bottom: 1px solid #1a2638;
        }
        th {
            color: #6a7a8a;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.5px;
        }
        td.num { text-align: right; font-variant-numeric: tabular-nums; color: #b0c0d0; }
        td.label { color: #e0e0e0; font-family: ui-monospace, 'SF Mono', monospace; font-size: 11px; }
        tr:last-child td { border-bottom: none; }

        /* ── Sparklines ────────────────────────────────────────
           Each boundary row carries a 60-point p95 sparkline. The
           SVG sizes itself to its td via viewBox; CSS controls the
           visible width. Rendered client-side from /fleet/history JSON.
        */
        td.spark { padding: 4px 10px; width: 96px; }
        td.spark svg {
            display: block;
            width: 90px;
            height: 22px;
        }
        td.spark .spark-line { fill: none; stroke: #4fc3f7; stroke-width: 1.2; }
        td.spark .spark-area { fill: rgba(79,195,247,0.15); stroke: none; }
        td.spark.empty { color: #6a7a8a; font-size: 10px; }

        /* ── Activity feed ─────────────────────────────────── */
        .feed { max-height: 420px; overflow-y: auto; }
        .feed-item {
            padding: 10px 16px;
            border-bottom: 1px solid #1a2638;
            font-size: 13px;
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 12px;
            line-height: 1.4;
        }
        .feed-item:last-child { border-bottom: none; }
        .feed-item .who-name {
            color: #4fc3f7;
            font-weight: 600;
            font-size: 12px;
        }
        .feed-item .who-ts {
            color: #6a7a8a;
            font-size: 10px;
            font-variant-numeric: tabular-nums;
            font-family: ui-monospace, monospace;
            margin-top: 2px;
        }
        .feed-item .what { color: #e0e0e0; word-break: break-word; }
        .feed-item.warn .who-name { color: #ffa726; }
        .feed-item.error .who-name { color: #ef5350; }

        /* ── Peer cards ────────────────────────────────────── */
        .peer-grid { display: grid; gap: 10px; padding: 14px 16px; }
        .peer-row {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 12px;
            align-items: center;
            padding: 10px 12px;
            background: #0f1622;
            border: 1px solid #1a2638;
            border-radius: 8px;
            font-size: 13px;
        }
        .peer-row.ready    { border-left: 3px solid #66bb6a; }
        .peer-row.degraded { border-left: 3px solid #ffa726; }
        .peer-row.error    { border-left: 3px solid #ef5350; }
        .peer-row.unknown  { border-left: 3px solid #6a7a8a; }
        .peer-name { font-weight: 600; color: #e0e0e0; }
        .peer-host { color: #6a7a8a; font-size: 11px; font-family: ui-monospace, monospace; }
        .peer-stat { color: #b0c0d0; font-size: 12px; font-variant-numeric: tabular-nums; }
        .peer-radio.online  { color: #66bb6a; }
        .peer-radio.offline { color: #6a7a8a; }
        .peer-row.peer-error .peer-stat { color: #ef5350; font-size: 11px; }

        /* ── Federation peers ─────────────────────────────── */
        .fed-summary {
            padding: 6px 16px 0;
            font-size: 11px;
            color: #6a7a8a;
        }
        .fed-summary strong { color: #b0c0d0; }
        .source-tag {
            display: inline-block;
            font-size: 9px;
            padding: 1px 6px;
            border-radius: 8px;
            background: #2a3a4a;
            color: #4fc3f7;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .source-tag.directory { background: #1a2638; color: #6a7a8a; }
        /* Federation freshness — active gateways like moc/moc3
           re-announce every ~5-15 min; everything else is stale-but-
           still-alive coasting on the freshness window. */
        .fed-active td.fed-age { color: #66bb6a; font-weight: 600; }
        .fed-stale td.fed-age { color: #6a7a8a; }
        .fed-name-row { display: flex; align-items: center; gap: 6px; }
        .fed-name-row .fed-hash {
            color: #6a7a8a;
            font-family: ui-monospace, monospace;
            font-size: 10px;
        }
        .freshness-tag {
            display: inline-block;
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .freshness-tag.active { background: #1b3a25; color: #66bb6a; }
        .freshness-tag.stale  { background: #2a2a2a; color: #999; }

        /* ── Misc ──────────────────────────────────────────── */
        .empty { padding: 24px 16px; text-align: center; color: #6a7a8a; font-size: 12px; }
        .err-list { padding: 8px 16px; font-size: 11px; color: #ffa726; }
        .err-list .err { padding: 2px 0; }

        /* ── BLACKOUT banner ──────────────────────────────────
           Red strip across the top when the watchdog has open
           blackout rows. The banner is the operator's "things have
           fallen silent" signal — keep it loud and unambiguous.
        */
        .blackout-banner {
            display: none;
            background: linear-gradient(90deg, #b71c1c 0%, #d32f2f 100%);
            color: #ffeeee;
            padding: 14px 20px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-weight: 600;
            box-shadow: 0 0 16px rgba(239, 83, 80, 0.4);
            border: 1px solid #ef5350;
        }
        .blackout-banner.show { display: block; }
        .blackout-banner h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .blackout-banner .blackout-list {
            font-family: ui-monospace, monospace;
            font-size: 12px;
            font-weight: 400;
        }
        .blackout-banner .kind {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 1px 6px;
            border-radius: 4px;
            margin-right: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>Fleet Monitor — MeshAnchor NOC</h1>
        <div class="meta">
            <span id="indicator" class="pulse"></span>
            <strong id="self-host">…</strong>
            &middot; updated <strong id="updated">never</strong>
            &middot; refresh every <strong id="refresh-int">5</strong>s
        </div>
    </div>

    <div id="blackout-banner" class="blackout-banner">
        <h3>⚠ Blackout detected</h3>
        <div class="blackout-list" id="blackout-list"></div>
    </div>

    <div class="grid">
        <div class="col">
            <!-- SLO banner + pills -->
            <div class="card">
                <div class="slo-banner">
                    <span id="slo-status" class="slo-status unknown">…</span>
                    <div class="slo-detail">
                        <div><strong id="slo-services">…</strong> required services available <span id="slo-services-optional" class="slo-optional"></span></div>
                        <div>uptime <strong id="slo-uptime">…</strong></div>
                    </div>
                </div>
                <div class="body">
                    <div class="pills" id="slo-pills"></div>
                    <div class="pills pills-optional" id="slo-pills-optional"></div>
                </div>
            </div>

            <!-- Top boundaries -->
            <div class="card">
                <h2>Top Boundaries (call volume)</h2>
                <table>
                    <thead>
                        <tr><th>label</th><th class="num">count</th><th class="num">p50</th><th class="num">p95</th><th class="num">p99</th><th class="num">err</th><th>p95 trend</th></tr>
                    </thead>
                    <tbody id="boundaries-tbody"></tbody>
                </table>
            </div>

            <!-- Activity feed -->
            <div class="card">
                <h2>Activity</h2>
                <div class="feed" id="activity-feed"></div>
            </div>
        </div>

        <div class="col">
            <!-- Peer rollup -->
            <div class="card">
                <h2>Fleet Rollup</h2>
                <div class="peer-grid" id="peer-grid"></div>
            </div>

            <!-- Federation peers -->
            <div class="card">
                <h2>Federation Peers (RNS / LXMF)</h2>
                <div class="fed-summary" id="fed-summary"></div>
                <table>
                    <thead>
                        <tr><th>name</th><th>type</th><th class="num">last</th><th>src</th></tr>
                    </thead>
                    <tbody id="federation-tbody"></tbody>
                </table>
            </div>

            <!-- Errors -->
            <div class="card" id="error-card" style="display:none;">
                <h2>Soft Failures</h2>
                <div class="err-list" id="error-list"></div>
            </div>
        </div>
    </div>

    <script>
        const REFRESH_MS = 5000;          // /fleet/slo + /fleet/activity (live panel)
        const SLOW_REFRESH_MS = 15000;    // /fleet/rollup (~5s) + /fleet/federation
        const SPARK_REFRESH_MS = 30000;   // background sparkline refresh
        const STALE_THRESHOLD_MS = 12000;
        let lastUpdateMs = 0;

        const $ = (id) => document.getElementById(id);

        document.getElementById('refresh-int').textContent = REFRESH_MS / 1000;

        // ── Helpers ────────────────────────────────────────────
        function fmtUptime(s) {
            if (s == null) return '?';
            s = Math.floor(s);
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            return `${h}h ${m}m`;
        }
        function fmtAge(s) {
            if (s == null) return '—';
            if (s < 60) return `${Math.round(s)}s`;
            if (s < 3600) return `${Math.round(s / 60)}m`;
            return `${(s / 3600).toFixed(1)}h`;
        }
        function fmtClock(unix) {
            if (!unix) return '';
            const d = new Date(unix * 1000);
            const hh = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            const ss = String(d.getSeconds()).padStart(2, '0');
            return `${hh}:${mm}:${ss}`;
        }
        // Pull a "name:" or "name: " prefix off the text field when the
        // dedicated `sender` field comes back empty. MeshCore handler
        // packs the contact name into the message body for some
        // channels, so without this the dashboard renders every chat as
        // "—  meshanchor p3:  hello" which buries the actual content.
        function splitSender(entry) {
            const explicit = entry.sender || entry.from || entry.contact;
            if (explicit) return { sender: explicit, text: entry.text || '' };
            const text = entry.text || '';
            const match = text.match(/^([^:\n]{1,40}?):\s+(.*)$/s);
            if (match) return { sender: match[1].trim(), text: match[2].trim() };
            return { sender: '—', text };
        }
        function fmtMs(s) {
            if (s == null) return '—';
            return (s * 1000).toFixed(1) + 'ms';
        }
        function el(tag, attrs = {}, children = []) {
            const e = document.createElement(tag);
            for (const [k, v] of Object.entries(attrs)) {
                if (k === 'class') e.className = v;
                else if (k === 'text') e.textContent = v;
                else e.setAttribute(k, v);
            }
            (Array.isArray(children) ? children : [children]).forEach(c => {
                if (c == null) return;
                e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
            });
            return e;
        }
        async function fetchJson(path) {
            const resp = await fetch(path, { headers: { 'Accept': 'application/json' } });
            if (!resp.ok) throw new Error(`${path} ${resp.status}`);
            return resp.json();
        }

        // ── Renderers ──────────────────────────────────────────
        function renderSlo(slo) {
            $('self-host').textContent = slo.host || '?';
            const status = (slo.overall_status || 'unknown').toLowerCase();
            const sloEl = $('slo-status');
            sloEl.textContent = status;
            sloEl.className = 'slo-status ' + status;
            const services = slo.services || {};
            // Prefer the `required` slice for the headline so MeshCore-
            // primary NOCs read 2/2 instead of 2/6 when the four
            // optional services (meshtasticd*, nomadnet, meshcore-radio
            // supervisor) are intentionally down. Falls back to the
            // legacy total/available fields for older daemons that
            // don't ship the split.
            const required = services.required;
            const optional = services.optional;
            const headAvail = required ? required.available : (services.available || 0);
            const headTotal = required ? required.total : (services.total || 0);
            $('slo-services').textContent = `${headAvail} / ${headTotal}`;
            const optTag = $('slo-services-optional');
            if (optional && optional.total > 0) {
                optTag.textContent = `(${optional.available} / ${optional.total} optional up)`;
            } else {
                optTag.textContent = '';
            }
            $('slo-uptime').textContent = fmtUptime(slo.uptime_s);

            // Service pills — split required (top) from optional (below
            // a divider, muted) so a row of "not_running" optional pills
            // doesn't drown the actually-load-bearing services.
            const pills = $('slo-pills');
            const pillsOpt = $('slo-pills-optional');
            pills.innerHTML = '';
            pillsOpt.innerHTML = '';
            const reqByState = (required && required.by_state) || services.by_state || {};
            for (const [state, count] of Object.entries(reqByState)) {
                pills.appendChild(el('span', { class: `pill ${state}`, text: `${state} ${count}` }));
            }
            const optByState = (optional && optional.by_state) || {};
            for (const [state, count] of Object.entries(optByState)) {
                pillsOpt.appendChild(el('span', { class: `pill ${state}`, text: `${state} ${count}` }));
            }

            // Top boundaries
            const tbody = $('boundaries-tbody');
            tbody.innerHTML = '';
            const top = slo.boundaries_top || [];
            if (top.length === 0) {
                tbody.appendChild(el('tr', {}, el('td', { colspan: 7, class: 'empty', text: 'no boundary calls yet' })));
            } else {
                for (const b of top.slice(0, 8)) {
                    const tr = el('tr');
                    tr.appendChild(el('td', { class: 'label', text: b.label }));
                    tr.appendChild(el('td', { class: 'num', text: String(b.count) }));
                    tr.appendChild(el('td', { class: 'num', text: fmtMs(b.p50_s) }));
                    tr.appendChild(el('td', { class: 'num', text: fmtMs(b.p95_s) }));
                    tr.appendChild(el('td', { class: 'num', text: fmtMs(b.p99_s) }));
                    tr.appendChild(el('td', { class: 'num', text: b.error_rate ? (b.error_rate * 100).toFixed(1) + '%' : '0' }));
                    // Sparkline cell — replays cached SVG immediately so
                    // the chart doesn't flash on every 5s tbody rebuild.
                    // Background `pollSparklines()` keeps the cache fresh.
                    const sparkCell = el('td', { class: 'spark' });
                    sparkCell.dataset.label = b.label;
                    const cached = sparkCache[b.label];
                    if (cached) {
                        sparkCell.innerHTML = cached.html;
                        sparkCell.title = cached.title;
                    } else {
                        sparkCell.classList.add('empty');
                        sparkCell.textContent = '…';
                    }
                    tr.appendChild(sparkCell);
                    tbody.appendChild(tr);
                }
            }
        }

        // ── Sparkline rendering ─────────────────────────────────
        // Build an SVG path from a sequence of (ts, value) points.
        // Caller owns layout (width/height); this just produces the
        // `d` attribute strings for line + filled area.
        function buildSparkPath(points, width, height, valueKey) {
            if (!points || points.length < 2) return null;
            const values = points.map(p => p[valueKey] ?? 0);
            const minV = Math.min(...values);
            const maxV = Math.max(...values);
            const range = maxV - minV || 1;  // avoid /0 on flat series
            const dx = width / (points.length - 1);
            const ys = values.map(v => height - ((v - minV) / range) * height);
            let line = `M 0 ${ys[0].toFixed(2)}`;
            for (let i = 1; i < points.length; i++) {
                line += ` L ${(i * dx).toFixed(2)} ${ys[i].toFixed(2)}`;
            }
            const area = `${line} L ${width} ${height} L 0 ${height} Z`;
            return { line, area, minV, maxV };
        }

        // ── Blackout banner ──────────────────────────────────
        // Polls /fleet/blackouts every 10s. Shows the red banner
        // only when there are active blackouts. Independent of
        // the main 5s tick so a slow blackouts query can't gate
        // the live SLO panel.
        function fmtBlackoutDuration(startedTs) {
            const dur = Math.max(0, (Date.now() / 1000) - startedTs);
            if (dur < 60) return `${Math.round(dur)}s`;
            if (dur < 3600) return `${Math.round(dur / 60)}m`;
            return `${(dur / 3600).toFixed(1)}h`;
        }
        async function pollBlackouts() {
            const banner = $('blackout-banner');
            const list = $('blackout-list');
            try {
                const body = await fetchJson('/fleet/blackouts?active_only=1');
                const active = body.active || [];
                if (active.length === 0) {
                    banner.classList.remove('show');
                    return;
                }
                banner.classList.add('show');
                list.innerHTML = '';
                for (const b of active) {
                    const dur = fmtBlackoutDuration(b.ts_started);
                    const div = el('div', {}, [
                        el('span', { class: 'kind', text: b.kind }),
                        document.createTextNode(`${b.reason || ''} · ongoing ${dur}`),
                    ]);
                    list.appendChild(div);
                }
            } catch (e) {
                // Silent failure — a fetch error shouldn't pop the
                // banner because the banner itself is a fetch result.
                // The main panel's stale-pulse handles "we're not
                // fetching" detection.
                console.warn('blackouts poll failed:', e);
            }
        }

        // Cache of rendered sparkline HTML keyed by boundary label.
        // The main /fleet/slo render replays from this so the chart
        // doesn't flash to "…" every 5s when the tbody is rebuilt.
        // Each entry: { html: '<svg…>', title: 'p95 …', empty: false }
        const sparkCache = {};
        let sparkInFlight = false;
        async function pollSparklines() {
            // Skip if a previous run is still in flight — protects
            // against piling up fetches when the server is slow.
            if (sparkInFlight) return;
            sparkInFlight = true;
            try {
                const cells = Array.from(document.querySelectorAll('td.spark[data-label]'));
                if (cells.length === 0) return;
                const since = Math.floor(Date.now() / 1000 - 1800);  // last 30 min
                // Parallel fetch — 8 cells × ~5ms serial is fine, but
                // doing them in parallel keeps the spark refresh tight
                // even if the server picks up latency.
                await Promise.all(cells.map(async (cell) => {
                    const label = cell.dataset.label;
                    try {
                        const url = `/fleet/history?metric=boundary&label=${encodeURIComponent(label)}&since=${since}&resolution=60`;
                        const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
                        if (!resp.ok) throw new Error(`history ${resp.status}`);
                        const body = await resp.json();
                        const pts = body.points || [];
                        const path = buildSparkPath(pts, 90, 22, 'p95_ms');
                        if (!path) {
                            const placeholder = pts.length === 1 ? '1 pt' : '—';
                            sparkCache[label] = { html: '', title: '', empty: true, placeholder };
                            cell.classList.add('empty');
                            cell.classList.remove('filled');
                            cell.textContent = placeholder;
                            return;
                        }
                        const html = `<svg viewBox="0 0 90 22" preserveAspectRatio="none">` +
                            `<path class="spark-area" d="${path.area}"/>` +
                            `<path class="spark-line" d="${path.line}"/></svg>`;
                        const title = `p95 ${path.minV.toFixed(1)}–${path.maxV.toFixed(1)}ms over last ${pts.length} samples`;
                        sparkCache[label] = { html, title, empty: false };
                        cell.classList.remove('empty');
                        cell.classList.add('filled');
                        cell.innerHTML = html;
                        cell.title = title;
                    } catch (e) {
                        // Don't poison the cache on transient fetch
                        // failures — keep the last good render visible.
                        if (!sparkCache[label]) {
                            cell.classList.add('empty');
                            cell.textContent = 'err';
                            cell.title = String(e);
                        }
                    }
                }));
            } finally {
                sparkInFlight = false;
            }
        }

        function renderActivity(activity) {
            const feed = $('activity-feed');
            feed.innerHTML = '';
            const chat = activity.chat_recent || [];
            const slow = activity.slow_boundaries || [];
            if (chat.length === 0 && slow.length === 0) {
                feed.appendChild(el('div', { class: 'empty', text: 'no recent activity' }));
                return;
            }
            for (const entry of chat.slice(-15).reverse()) {
                const { sender, text } = splitSender(entry);
                const ts = fmtClock(entry.ts);
                const dirTag = entry.direction === 'tx' ? '→ ' : '';
                feed.appendChild(el('div', { class: 'feed-item' }, [
                    el('div', { class: 'who' }, [
                        el('div', { class: 'who-name', text: dirTag + sender }),
                        ts ? el('div', { class: 'who-ts', text: ts }) : null,
                    ]),
                    el('div', { class: 'what', text: text }),
                ]));
            }
            for (const b of slow.slice(0, 5)) {
                const cls = b.error_count > 0 ? 'feed-item error' : 'feed-item warn';
                const detail = `slow=${b.slow_count} err=${b.error_count} p99=${fmtMs(b.p99_s)}`;
                feed.appendChild(el('div', { class: cls }, [
                    el('div', { class: 'who', text: b.label.split('.')[0] }),
                    el('div', { class: 'what', text: `${b.label} — ${detail}` }),
                ]));
            }
        }

        function renderRollup(rollup) {
            const grid = $('peer-grid');
            grid.innerHTML = '';
            const rows = [
                {
                    name: rollup.self_host || 'self',
                    host: '(this host)',
                    snapshot: rollup.self_snapshot,
                    error: null,
                    is_self: true,
                },
                ...(rollup.peers || []).map(p => ({ ...p, is_self: false })),
            ];
            for (const row of rows) {
                const snap = row.snapshot || {};
                const status = (snap.overall_status || (row.error ? 'error' : 'unknown')).toLowerCase();
                const services = snap.services || {};
                const radio = snap.radio || {};
                const cls = row.error ? 'peer-row peer-error error' : `peer-row ${status}`;
                const div = el('div', { class: cls });
                div.appendChild(el('div', {}, [
                    el('div', { class: 'peer-name', text: row.name }),
                    el('div', { class: 'peer-host', text: row.host || '' }),
                ]));
                if (row.error) {
                    div.appendChild(el('div', { class: 'peer-stat', text: row.error.slice(0, 30) }));
                    div.appendChild(el('div'));
                    div.appendChild(el('div'));
                } else {
                    div.appendChild(el('div', { class: 'peer-stat', text: status }));
                    // Peer card services count: prefer `required` slice
                    // so a peer's optional Meshtastic-side daemons being
                    // down doesn't make it look unhealthier than it is.
                    const reqStats = services.required;
                    const sAvail = reqStats ? reqStats.available : (services.available ?? 0);
                    const sTotal = reqStats ? reqStats.total : (services.total ?? 0);
                    div.appendChild(el('div', { class: 'peer-stat', text: `${sAvail}/${sTotal}` }));
                    div.appendChild(el('div', {
                        class: 'peer-stat peer-radio ' + (radio.connected ? 'online' : 'offline'),
                        text: radio.connected ? 'radio on' : 'radio —',
                    }));
                }
                grid.appendChild(div);
            }
        }

        // Active = re-announced inside this window. moc/moc3 typically
        // announce every 5-15 min; the threshold is generous (20 min)
        // so transient gaps don't flap a peer to "stale".
        const FED_ACTIVE_AGE_S = 1200;

        function renderFederation(fed) {
            const summary = $('fed-summary');
            summary.innerHTML = '';
            const sources = fed.sources || [];
            const peers = fed.peers || [];
            const active = peers.filter(p =>
                p.last_seen_age_s != null && p.last_seen_age_s <= FED_ACTIVE_AGE_S
            ).length;
            summary.textContent =
                `${peers.length} peers (${active} active, ${peers.length - active} stale) · ` +
                `sources: ${sources.length ? sources.join(', ') : 'none'}`;

            const tbody = $('federation-tbody');
            tbody.innerHTML = '';
            if (peers.length === 0) {
                tbody.appendChild(el('tr', {}, el('td', { colspan: 4, class: 'empty', text: 'no federation peers heard yet' })));
                return;
            }
            for (const p of peers.slice(0, 30)) {
                const age = p.last_seen_age_s;
                const isActive = age != null && age <= FED_ACTIVE_AGE_S;
                const tr = el('tr', { class: isActive ? 'fed-active' : 'fed-stale' });

                // Name + short hash so mojibake-named peers (e.g. iF@p@)
                // are still identifiable at a glance.
                const nameCell = el('td', { class: 'label' });
                const hashShort = (p.hash_hex || p.node_id || '').slice(0, 8);
                nameCell.appendChild(el('div', { class: 'fed-name-row' }, [
                    el('span', { text: (p.name || hashShort).slice(0, 24) }),
                    hashShort && p.name && p.name !== hashShort
                        ? el('span', { class: 'fed-hash', text: hashShort })
                        : null,
                    el('span', {
                        class: 'freshness-tag ' + (isActive ? 'active' : 'stale'),
                        text: isActive ? 'active' : 'stale',
                    }),
                ]));
                tr.appendChild(nameCell);

                tr.appendChild(el('td', { text: (p.service_type || p.source_origin || '').toLowerCase() }));
                tr.appendChild(el('td', { class: 'num fed-age', text: fmtAge(age) }));
                tr.appendChild(el('td', {}, el('span', {
                    class: 'source-tag ' + (p.source || ''),
                    text: p.source || '?',
                })));
                tbody.appendChild(tr);
            }
        }

        function renderErrors(errors) {
            const card = $('error-card');
            const list = $('error-list');
            list.innerHTML = '';
            if (!errors || errors.length === 0) {
                card.style.display = 'none';
                return;
            }
            card.style.display = '';
            for (const e of errors) {
                list.appendChild(el('div', { class: 'err', text: `${e.source || '?'}: ${e.error || ''}` }));
            }
        }

        // ── Polling loop ───────────────────────────────────────
        // Each endpoint fetches + renders independently so a slow
        // /fleet/rollup (which can run ~1.8s) doesn't block the
        // activity feed (~160ms). A failure in one endpoint also
        // doesn't suppress the rest — the previous Promise.all version
        // would render nothing if any single fetch threw.
        let aggregatedErrors = {};
        const inFlight = {};
        function bumpUpdate() {
            lastUpdateMs = Date.now();
            $('updated').textContent = new Date().toLocaleTimeString();
        }
        async function pollEndpoint(name, path, render, onSuccess) {
            // Drop overlapping calls — /fleet/rollup can take ~5s, so
            // without this guard a slow tick stacks requests on the
            // server. The next interval will retry naturally.
            if (inFlight[name]) return;
            inFlight[name] = true;
            try {
                const body = await fetchJson(path);
                render(body);
                aggregatedErrors[name] = body.errors || [];
                bumpUpdate();
                if (onSuccess) onSuccess(body);
            } catch (e) {
                console.error(`fleet ${name} fetch failed:`, e);
                aggregatedErrors[name] = [{ source: name, error: String(e) }];
            } finally {
                inFlight[name] = false;
            }
            // Re-render the soft-error card whenever any endpoint
            // updates, since errors are per-endpoint.
            const all = Object.values(aggregatedErrors).flat();
            renderErrors(all);
        }
        function tickFast() {
            // Live panel: SLO + activity. Sparklines refresh right
            // after the SLO render lands so the boundaries table and
            // its sparkline column stay in lockstep — eliminates the
            // "graphs disappear between ticks" flicker.
            pollEndpoint('slo', '/fleet/slo', renderSlo, () => pollSparklines());
            pollEndpoint('activity', '/fleet/activity', renderActivity);
        }
        function tickSlow() {
            // Rollup is ~5s on this host (SSH peer polling); federation
            // is steadier. Both change slowly enough that 15s is plenty
            // and avoids the overlap-with-itself thrash on rollup.
            pollEndpoint('rollup', '/fleet/rollup', renderRollup);
            pollEndpoint('federation', '/fleet/federation', renderFederation);
        }
        function staleTick() {
            const indicator = $('indicator');
            if (lastUpdateMs && (Date.now() - lastUpdateMs) > STALE_THRESHOLD_MS) {
                indicator.classList.add('stale');
            } else {
                indicator.classList.remove('stale');
            }
        }

        tickFast();
        tickSlow();
        setInterval(tickFast, REFRESH_MS);
        setInterval(tickSlow, SLOW_REFRESH_MS);
        setInterval(staleTick, 1000);
        // Background sparkline refresh as a safety net — the main
        // refresh is now driven by tickFast() right after renderSlo,
        // but this catches the edge case where the boundaries table
        // didn't change but the underlying history has new points.
        setInterval(pollSparklines, SPARK_REFRESH_MS);
        // Blackout banner: poll every 10s. Tighter than sparklines
        // because a blackout is the most operationally important
        // thing the dashboard can show; still slower than the main
        // tick to avoid racing the watchdog's own update cadence.
        pollBlackouts();
        setInterval(pollBlackouts, 10000);
    </script>
</body>
</html>
