# Drop-in for rnsd.service — REQUIRED cap on the stop timeout (90s -> 15s).
# Ported from MeshForge (RNS-parity port, 2026-05-31). Applies to either the
# system rnsd.service or the user-level rnsd (~/.config/systemd/user/rnsd.service).
#
# DO NOT RETIRE THIS FILE. rnsd's SIGTERM handler can hang on a busy transport
# node, and systemd would otherwise wait the full 90s default before SIGKILL.
# This cap makes that bounded + deterministic (~15s).
#
# WHAT THE FORK FIXED (rns 1.2.5+mf.3, 2026-05-30): RNS.Transport.detach_interfaces()
# — one place the SIGTERM main thread can block — is now bounded to RNS_DETACH_TIMEOUT
# (default 5s). That cures the detach-hang at the source.
#
# WHAT IT DID NOT FIX (proven 2026-05-30 on the MeshForge fleet): an active proof
# (deliberate rnsd restart cycles) caught a box hanging the FULL 15s -> SIGKILL
# (result=timeout, status=9/KILL) WITH mf.3 loaded, and the DETACH_TIMEOUT warning
# never fired — so a SECOND shutdown-path hang exists that the detach bound does NOT
# cover. Only SIGKILL ends that case. THIS 15s CAP IS THE GENUINE CURE for it —
# that is why it must stay.
#
# WHY THE CAP IS SAFE: SIGKILL stops rnsd either way; RNS rebuilds its path table
# from announces within ~1 min of restart, so a fast SIGKILL loses nothing.
#
# OPERATIONAL WARNING: do NOT rapid-cycle rnsd restarts fleet-wide — each 15s-hang +
# SIGKILL plus the slow rebind opens an @rns race window for periodic RNS clients
# (the lab tracer), which can grab @rns and strand rnsd as a client (#69-adjacent).
# Space restarts out and verify rnsd owns @rns before the next box.
#
# Install (system rnsd):  sudo cp 10-stop-timeout.conf /etc/systemd/system/rnsd.service.d/
#                         sudo systemctl daemon-reload
# Install (user rnsd):    mkdir -p ~/.config/systemd/user/rnsd.service.d
#                         cp 10-stop-timeout.conf ~/.config/systemd/user/rnsd.service.d/
#                         systemctl --user daemon-reload
[Service]
TimeoutStopSec=15s
